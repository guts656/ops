services:
  api:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ops-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ops_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ops-platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_platform} -d ${POSTGRES_DB:-ops_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ops-platform-postgres-data:
    name: ops-platform-postgres-data
